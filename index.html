<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BioNova — We've Moved</title>
  <meta http-equiv="refresh" content="10;url=https://bionovadigesters.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="design.css"/>
</head>
<body>

  <div class="scene">
    <img class="scene__photo" src="Images/smartDigesters.png" alt="" aria-hidden="true"/>
    <div class="scene__overlay"></div>
    <canvas class="scene__particles" id="particles"></canvas>
  </div>

  <!-- Scanline texture -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="stage">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar__logo">
    <img src="Images/bionova-logo.png" alt="BioNova Logo" class="topbar__logo-img">
    <span>BioNova</span>
      </div>
        <span>BioNova</span>
      </div>
      <div class="topbar__pill">
        <span class="topbar__dot"></span>
        New home
      </div>
    </header>

    <!-- Hero text block -->
    <section class="hero">
      <div class="hero__eyebrow">
        <div class="eyebrow__line"></div>
        <span>We've moved</span>
        <div class="eyebrow__line"></div>
      </div>

      <h1 class="hero__title">
        <span class="hero__title--top">Same mission.</span>
        <span class="hero__title--bottom">New&nbsp;address.</span>
      </h1>

      <p class="hero__sub">
        BioNova is now living at a brand-new domain.<br/>
        You'll be taken there automatically.
      </p>

      <!-- URL display -->
      <div class="url-display">
        <div class="url-display__from">
          <span class="url-label">Was</span>
          <span class="url-text url-text--old">bionova.ge</span>
        </div>
        <div class="url-display__arrow">
          <svg viewBox="0 0 40 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 7H38M32 1L38 7L32 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="url-display__to">
          <span class="url-label">Now</span>
          <span class="url-text url-text--new">bionovadigesters.com</span>
        </div>
      </div>

      <!-- CTA -->
      <a href="https://bionovadigesters.com" class="cta">
        <span class="cta__text">Take me there</span>
        <span class="cta__icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cta__shimmer"></span>
      </a>

      <!-- Countdown -->
      <div class="countdown">
        <div class="countdown__track">
          <div class="countdown__bar" id="countBar"></div>
        </div>
        <p class="countdown__text">
          Auto-redirecting in <strong id="timer">10</strong>s
        </p>
      </div>
    </section>

    <!-- Bottom tag -->
    <footer class="bottom-tag">
      <span>Farm-ready biodigesters · Clean energy · Bio-fertilizer</span>
    </footer>

  </main>

  <script src="slider.js"></script>
</body>
</html>
